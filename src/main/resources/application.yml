spring:
  application:
    name: ai-oss-contributor-agent
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:oss-agent;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  # 스키마 정본은 db/migration 의 SQL 이다 — Q-2 확정 (2026-09-21)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate 를 켜지 않는다. 켜면 「이미 있는 스키마」를 조용히 인정해
    # 마이그레이션 누락이 드러나지 않는다. 빈 DB 에서 V1 부터 쌓는다
    baseline-on-migrate: false
  jpa:
    hibernate:
      # ⚠ update 로 되돌리지 않는다. 엔티티가 스키마를 만들기 시작하면
      #   마이그레이션과 실제 스키마가 갈라지고, 그 사실이 운영에서야 드러난다
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  # 기준 URL 은 환경변수로 빼지 않는다. 바꿀 일이 테스트뿐이고, 테스트는 프로퍼티로 덮는다
  base-url: https://api.github.com
  # classic PAT · 스코프 public_repo — Q-1 확정. 비어 있으면 미인증(60 req/h)으로 동작한다
  token: ${GITHUB_TOKEN:}
  # ⚠ 기본값에 맡기지 않는다. JDK HttpClient 의 기본 연결 타임아웃은 무제한이다
  connect-timeout: 5s
  read-timeout: 10s
  # 전송 계층 재시도 상한 — 5xx·타임아웃에만 적용된다.
  # ⚠ agent.execution.max-retries 와 다른 축이다. 그쪽은 「구현→테스트」 루프 카운터이고
  #   AgentRun.attempt 에 기록된다. HTTP 5xx 한 번으로 그 카운터를 태우면
  #   후보가 코드 문제 없이 FAILED 로 떨어진다 — 재시도 단위의 정의는 미결(Q-6)
  max-retries: 2
  retry-backoff: 500ms
  # 남은 호출이 이 값 미만이면 경고만 남긴다. 지연 정책은 이슈 #8
  rate-limit-threshold: 100

agent:
  execution:
    max-retries: 3
    timeout-seconds: 1800
