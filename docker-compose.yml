services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oss_agent
      POSTGRES_USER: oss_agent
      POSTGRES_PASSWORD: oss_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
