spring:
  application:
    name: ai-oss-contributor-agent
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:oss-agent;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  # 스키마 정본은 db/migration 의 SQL 이다 — Q-2 확정 (2026-09-21)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate 를 켜지 않는다. 켜면 「이미 있는 스키마」를 조용히 인정해
    # 마이그레이션 누락이 드러나지 않는다. 빈 DB 에서 V1 부터 쌓는다
    baseline-on-migrate: false
  jpa:
    hibernate:
      # ⚠ update 로 되돌리지 않는다. 엔티티가 스키마를 만들기 시작하면
      #   마이그레이션과 실제 스키마가 갈라지고, 그 사실이 운영에서야 드러난다
      ddl-auto: validate
    open-in-view: false

# 🔴 MDC 를 로그 포맷에 싣는다 — #25 FR-5 · logging.md
#
# 왜 필요했나 — 코드는 MDC 를 성실히 채우고 있는데(RecordingLanguageModel ·
# AnalyzeIssuesUseCase · ScanExecutor · ScanPipelineUseCase) 출력 포맷이 그것을
# 버리고 있었다. 「한 후보가 여러 단계·여러 재시도를 거치므로 식별자 없이는 로그를
# 이어붙일 수 없다」(logging.md)는 바로 그 상황이었다.
#
# ⚠ logback-spring.xml 을 만들지 않는다. Boot 기본 패턴에 이미 correlation 자리가
#   있고, 직접 어펜더를 정의하면 Boot 가 주는 것들(색상·예외 축약·프로퍼티 바인딩)을
#   조용히 잃는다. 실제로 처음엔 XML 로 짰다가 ${CONSOLE_LOG_PATTERN:-...} 의 기본값이
#   영영 쓰이지 않는 것을 테스트가 잡아냈다 — 그 변수를 defaults.xml 이 이미 정의한다.
#
# 🔴 여기 찍히는 네 값은 전부 식별자·enum 이다. 로그 포맷은 모든 줄에 붙으므로
#   여기가 오염되면 전부 오염된다 — MdcLogPatternTest 가 그것을 고정한다.
#
# ⚠ stage 는 두 어휘가 섞인다 — LLM 구간은 LlmCallSite, 파이프라인은 PipelineStage.
#   중첩되면 안쪽이 바깥을 덮었다가 되돌아온다. 「지금 어느 단계인가」는 읽는 사람에게
#   하나의 질문이라 같은 키를 쓴다.
logging:
  pattern:
    # %X{key:-} 의 ':-' 는 「없으면 빈 문자열」이다. 없으면 'key_IS_UNDEFINED' 가 찍힌다
    correlation: "[%X{repositoryId:-}|%X{candidateId:-}|%X{stage:-}|%X{attempt:-}] "

management:
  endpoints:
    web:
      exposure:
        # ⚠️ metrics 를 켜면 우리 미터만 나오는 것이 아니다 — Boot 기본 미터
        #   (jvm.* · hikaricp.* · process.* · http.server.requests)가 함께 노출된다.
        #   그중 http.server.requests 의 uri 태그는 우리가 통제하지 않는다.
        #
        # 🔴 이 저장소에 spring-boot-starter-security 가 없다. 따라서 /actuator/** 는
        #   인증 없이 열린다 — 이미 health,info 가 같은 조건이라 이 줄이 노출면을
        #   새로 여는 것은 아니지만, 사실은 사실대로 적어 둔다.
        #
        # 배포할 때 결정할 것 두 가지 (scan.schedule.enabled 와 같은 논리다 —
        # 「켜는 것은 배포 결정이지 코드 기본값이 아니다」):
        #   · management.server.port 를 앱 포트와 분리한다
        #   · 인증을 붙이거나 내부망에만 바인드한다
        include: health,info,metrics

github:
  # 기준 URL 은 환경변수로 빼지 않는다. 바꿀 일이 테스트뿐이고, 테스트는 프로퍼티로 덮는다
  base-url: https://api.github.com
  # classic PAT · 스코프 public_repo — Q-1 확정. 비어 있으면 미인증(60 req/h)으로 동작한다
  token: ${GITHUB_TOKEN:}
  # ⚠ 기본값에 맡기지 않는다. JDK HttpClient 의 기본 연결 타임아웃은 무제한이다
  connect-timeout: 5s
  read-timeout: 10s
  # 전송 계층 재시도 상한 — 5xx·타임아웃에만 적용된다.
  # ⚠ agent.execution.max-retries 와 다른 축이다. 그쪽은 「구현→테스트」 루프 카운터이고
  #   AgentRun.attempt 에 기록된다. HTTP 5xx 한 번으로 그 카운터를 태우면
  #   후보가 코드 문제 없이 FAILED 로 떨어진다 — 재시도 단위의 정의는 미결(Q-6)
  max-retries: 2
  retry-backoff: 500ms
  # 🔴 남은 호출이 이 값 미만이면 호출하지 않고 GitHubRateLimitException 을 던진다 (#8).
  #    소진된 뒤가 아니라 임계 미만이 되는 순간부터다 — 예산을 끝까지 태우면 같은 토큰을
  #    쓰는 다른 작업(규약 수집 #7 · 코드 검색 #15)이 전부 막힌다.
  #    호출자는 이 예외를 실패가 아니라 「지연」으로 다룬다
  rate-limit-threshold: 100

  scan:
    # 스캔 1회의 페이지 상한. 상한 없이 hasNext 를 따라가면 첫 스캔이 리밋을 통째로 태운다
    # (spring-kafka 는 open 이슈가 수백 건이다). 잘리면 ScanResult.hasMore 로 드러난다
    max-pages-per-scan: 10
    # Retry-After 도 resetAt 도 없을 때의 기본 지연. 보수적으로 잡는다 —
    # 짧게 잡으면 2차 리밋에서 차단이 더 길어진다
    secondary-limit-backoff: 5m

issue:
  filter:
    # 공백을 뺀 본문이 이 길이 미만이면 「보류」다 — 배제가 아니다.
    # 짧다고 불명확한 것이 아니다(스택트레이스 링크 한 줄짜리 명확한 버그 리포트가 있다).
    # 200 인 근거 — GitHub 이슈 URL 하나가 60~80자라 「링크만 붙인 이슈」를 잡으려면 그보다
    # 커야 하고, 한두 문장짜리 정상 버그 리포트(100~150자)를 확정 배제하지 않으려면 그 위여야 한다
    min-body-length: 200
    # 코멘트가 이 수를 넘으면 「보류」. 논의가 길면 요구가 불명확할 확률이 높지만 인과가
    # 아니다 — 활발한 논의일 수도 있다. 판정은 #11 의 LLM 이 한다
    max-comment-count: 30
    # 🔴 한 트랜잭션에 판정할 이슈 수. issue.body 가 TEXT 이고 저장소 하나에 이슈가 수천
    #    건이라 전량을 한 트랜잭션에 올리면 메모리·커넥션 점유가 커진다
    batch-size: 200
    # 1회 실행의 배치 상한. 판정은 진행을 보장하므로 무한루프가 날 수 없지만, 그 보장에
    # 기대어 상한을 빼지 않는다 — 규칙을 잘못 고쳐 판정이 서지 않게 되면 유일한 제동이다
    max-batches-per-run: 100
    # ⚠ 값을 바꿔도 기존 판정은 다시 서지 않는다(알려진 한계). 재판정 트리거는
    #   「내용이 바뀌었는가」이지 「규칙이 바뀌었는가」가 아니다. 임계를 조정했으면
    #   UPDATE issue SET filter_result = NULL WHERE filter_judged_at < :규칙_변경_시각

repository:
  policy:
    # 문서 하나의 상한. 넘으면 자르지 않고 보류한다 — 잘린 뒷부분에 금지 문구가
    # 있었는지 판정할 방법이 없다 (S-5). GitHubRepositorySource 가 1MB 초과를 이미
    # 거르므로 이 상한은 그 아래 구간에 작동하고, README 를 넣으면 실제로 걸린다
    max-document-chars: 40000
    # 판정 응답은 짧은 JSON 이다. 크게 잡을 이유가 없다
    max-output-tokens: 2000

sandbox:
  # 🔴 S-3 의 실행체 설정 (#17). 네트워크는 여기 없다 — 명령 타입이 정한다.
  #    SANDBOX_NETWORK 를 키로 두면 실행 단계 격리가 배포 설정 한 줄로 꺼진다
  docker-api-version: ${SANDBOX_DOCKER_API_VERSION:1.44}
  default-image: ${SANDBOX_DOCKER_IMAGE:eclipse-temurin:21-jdk}
  # 워밍 전용 네트워크. host·container:<id>·bridge 는 코드가 거부한다
  warm-network: ${SANDBOX_WARM_NETWORK:oss-agent-warm}
  # 🔴 바인드 허용 루트. 비어 있으면 「모든 경로가 루트 하위」가 되어 경로 제한이 무력해진다.
  #    구체적인 기본 루트는 위반이 아니다 — 위반은 루트가 「없는」 것이다.
  #    상대경로면 기동 시점에 절대경로로 확정하고, 없으면 만든다
  workspace-root: ${SANDBOX_WORKSPACE_ROOT:build/sandbox-workspaces}
  cpu-limit: ${SANDBOX_CPU_LIMIT:2}
  # ⚠ 단위 필수. 단위 없는 값은 DataSize 에 바인딩되지 않는다
  memory-limit: ${SANDBOX_MEMORY_LIMIT:4GB}
  pids-limit: ${SANDBOX_PIDS_LIMIT:512}
  # ⚠ @DurationUnit(SECONDS) 로 단위를 못 박았다. 없으면 1800 이 밀리초로 읽혀
  #   1.8초가 되고, 모든 실행이 즉시 타임아웃하면서 증상은 「테스트가 자꾸 실패한다」로만 보인다.
  #   #10 의 timeout-seconds 함정과 같은 계열의 반대 방향이다
  timeout: ${SANDBOX_TIMEOUT_SECONDS:1800}
  warm-timeout: ${SANDBOX_WARM_TIMEOUT_SECONDS:1200}
  # 🔴 kill 직후 로그 조회가 매달리면 finally 의 제거에 도달하지 못해 컨테이너가 남는다
  log-timeout: ${SANDBOX_LOG_TIMEOUT_SECONDS:60}
  # 메모리 상한이다. 닿으면 더 쌓지 않고 truncated 로 표시한다 — 스트림 자체는
  # 끝나거나 log-timeout 에 걸릴 때까지 흐른다
  max-output-chars: ${SANDBOX_MAX_OUTPUT_CHARS:200000}

# 스캔 파이프라인 실행 — #14
scan:
  schedule:
    # 🔴 기본 꺼짐. 켜는 것은 배포 결정이지 코드 기본값이 아니다 —
    #    켜진 채로 뜨면 로컬 기동·통합 테스트가 GitHub 과 LLM 을 자동으로 탄다.
    #    ⚠ 실제 배선은 ScanScheduler·SchedulingConfig 의 @ConditionalOnProperty 다.
    #      그 애노테이션이 없으면 이 값은 아무 일도 하지 않는다
    #    ⚠ 이것은 비용·레이트리밋 방어이지 S-6 방어가 아니다. 자동 경로가 ANALYZED 에서
    #      멈추는 것은 이 플래그와 무관하게 성립한다
    enabled: false
    # 이전 실행이 끝난 뒤부터 센다. fixedRate 면 스캔이 주기보다 길 때 실행이 겹쳐 쌓인다
    fixed-delay: 1h
    initial-delay: 5m
  # 차면 409 로 거절한다. 무한 큐는 「쌓이는 줄 모르는」 상태를 만들고,
  # 그때 쌓이는 것은 몇 시간 뒤에 실행될 스캔이다
  queue-capacity: 10
  # 종료 시 진행 중 스캔을 기다린다 — 중간에 끊기면 커서가 어중간해진다
  shutdown-grace-seconds: 60

agent:
  execution:
    max-retries: 3
    timeout-seconds: 1800
  # 이슈 분석(#11) — PRD §11. LLM 호출 1건 = 후보 1건이다
  analysis:
    # 한 번에 집어 오는 분석 대상 이슈 수 (PASSED · UNDECIDED)
    batch-size: 50
    # 한 실행의 상한 — 최대 1,000건. 이슈 수천 건에 무한 루프를 만들지 않는다
    max-batches-per-run: 20
    # 관찰값 7개 + 요약이면 충분하다. agent.llm 의 16000 은 이 용도에 과하다
    max-output-tokens: 1500
    # 이슈 본문 절단. 「저장소 전체를 프롬프트에 넣지 않는다」(PRD §12)와 같은 정신이다.
    # ⚠ 절단했다는 사실을 프롬프트에 함께 적는다 — 말하지 않으면 모델이 전문을 봤다고
    #   전제하고 confidence 를 높게 준다
    max-body-chars: 20000
    # 🔴 미만이면 REJECTED — 그리고 REJECTED 는 종단이다.
    #   나중에 값을 낮춰도 이미 걸러진 후보는 돌아오지 않는다(재분석 경로 없음).
    #   조이는 것은 언제든 되지만 푸는 것은 소급되지 않으므로 느슨하게 잡았다.
    #   실측 0건에서 정한 추정값이라 설정으로 빼 뒀다 — PLAN-11 A-1
    min-confidence: 0.50
  # 저장소 분석(#15) — PRD §12. 「저장소 전체를 LLM 에 넘기지 않는다」를 숫자로 만든 것이다.
  # ⚠ 전부 실측 0건의 추정값이다. 첫 End-to-End 를 돌려 보고 조정한다
  context:
    # 계획 단계(#16)가 볼 파일 수
    max-files: 12
    # 🔴 max-files 와 다른 축이다 — 파일 예산은 「성공한 선별」만 센다.
    #    실패한 읽기(404·1MB 초과·심볼릭링크)는 예산을 쓰지 않으므로 이 상한이 없으면
    #    실패가 계속될 때 후보 전량을 두드린다. 흔한 낱말 하나가 수천 경로에 걸릴 수 있고,
    #    그러면 저장소 하나가 시간당 토큰 예산을 태워 규약 수집(#7)·이슈 수집(#8)까지 막는다
    max-fetch-attempts: 24
    # 컨텍스트 전체 문자 수. 하류 프롬프트 예산의 대부분을 여기 쓴다
    max-total-chars: 120000
    # 🔴 파일 하나의 상한. 넘으면 잘라 넣지 않고 통째로 버린다 —
    #    닫히지 않은 블록을 본 모델이 문법 오류로 읽거나 없는 메서드를 있다고 전제한다
    max-file-chars: 40000
    # 키워드가 수백 개가 되면 점수가 평평해져 변별력이 사라진다
    max-keywords: 40
    # 고른 파일이 import 하는 같은 저장소 파일을 남은 예산만큼 채운다 (1-hop)
    import-expansion: true
  llm:
    # 기준 URL 은 환경변수로 빼지 않는다 — github.base-url 과 같은 이유다.
    # ⚠ SDK 의 fromEnv() 를 쓰지 않는 이유가 여기 있다. 그쪽은 ANTHROPIC_BASE_URL 과
    #   ANTHROPIC_AUTH_TOKEN 까지 함께 읽어, 환경변수 하나로 프롬프트 송신 대상 호스트가
    #   바뀔 수 있다. 키만 환경에서 받고 목적지는 우리가 고정한다 — S-4
    base-url: https://api.anthropic.com
    api-key: ${ANTHROPIC_API_KEY:}
    # external-deps.md 가 정한 기본 모델
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    # 비스트리밍 요청이 SDK HTTP 타임아웃을 넘지 않는 범위의 상한.
    # 상한에서 잘리면 성공이 아니라 TRUNCATED 예외다
    max-output-tokens: 16000
    # Q-3(프로필 미분리)을 감안해 보수적으로 잡았다. 코딩 단계 diff 가 가장 길어
    # 호출 지점별로 달리 줄 여지가 있으나, 실측 전에는 나누지 않는다.
    # ⚠ 키 이름이 필드명(timeout)과 같아야 한다. `timeout-seconds` 로 두면 Duration 에
    #   바인딩되지 않아 값을 낮춰도 아무 일도 일어나지 않는다 — github.read-timeout 과 같은 형식
    timeout: 120s
    # 전송 계층 재시도 상한 — github.max-retries 와 같은 축이다.
    # ⚠ agent.execution.max-retries(3) 와는 다른 축이다. Q-6 확정:
    #   그쪽은 CODE→VERIFY→REVIEW 한 바퀴를 세고 AgentRun.attempt 에 기록된다.
    #   곱셈 예산 3 × (1 + 2) = 후보 1건당 대외 호출 최대 9회
    max-retries: 2
    retry-backoff: 500ms
