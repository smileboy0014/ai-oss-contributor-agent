# 유일한 강제 게이트다 — open-questions.md Q-10.
#
# git pre-commit 훅(.githooks/pre-commit)은 커밋 전에 같은 스캔 2종을 돌리지만,
# `--no-verify` 로 우회 가능하고 core.hooksPath 등록을 잊으면 아예 돌지 않는다.
# 그래서 여기서 tree 모드(추적 파일 전체)로 다시 돌린다.
name: build

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 — 🔴 **PR 에서만**.
#
# 원래 무조건 취소였다. PR 에서는 옳다(직전 head 의 결과는 쓸모가 없다). 그런데
# main 은 group 이 `refs/heads/main` **하나**라, 연달아 머지하면 **앞 머지의 검증이
# 뒤 머지에 취소된다.**
#
# 🔴 그 커밋은 **영영 검증되지 않는다.** squash 머지는 새 커밋을 만들므로 PR 의 green 은
# 브랜치 head 의 것이고, main 커밋을 보는 실행은 이 push 하나뿐이다.
#
# 실측 (2026-09-27 · #61) — main push 최근 25건: **success 16 · cancelled 8 · failure 1**.
# 즉 **머지 셋 중 하나가 검증 없이 지나갔다.** 그리고 유일한 failure(2026-09-26 11:15)가
# #61 이 기록한 그 사건인데, 같은 분에 취소된 실행이 **2건 더** 있었다 — 세 개를 연달아
# 머지한 자리다. 「합쳐진 뒤 빨개지면 안다」는 전제 자체가 그때 성립하지 않았다.
#
# ⚠ 대가는 실행 수가 는다는 것뿐이다(머지당 4분). 검증되지 않은 main 커밋보다 싸다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: 안전 게이트 + 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ── 싼 검사가 먼저. 시크릿이 걸리면 빌드를 돌려볼 이유가 없다 ──
      - name: 시크릿 검사 (S-4)
        env:
          SCAN_MODE: tree
        run: .claude/scripts/secret-scan.sh

      - name: 안전 경계 정적 검사 (S-1~S-4)
        env:
          SCAN_MODE: tree
        run: .claude/scripts/safety-boundary-check.sh

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # ⚠ build.gradle.kts 가 docker-java 를 api.version=1.44 로 핀해 뒀다 (Q-9b).
      #   러너 엔진이 그보다 낮으면 Testcontainers 가 「Docker 환경을 찾을 수 없다」로 죽는데
      #   증상이 원인을 가린다. 버전을 먼저 찍어 두면 진단이 한 줄로 끝난다.
      #   2026-09-25 ubuntu-latest 실측: Server API=1.48 — 핀보다 높으므로 안전하다.
      #   러너 이미지가 바뀌어 이 값이 1.44 아래로 내려가면 그때 핀을 조정한다.
      - name: Docker API 버전 (Testcontainers 전제)
        run: docker version --format 'Server API={{.Server.APIVersion}}'

      - name: build
        run: ./gradlew build
